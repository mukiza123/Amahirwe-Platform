<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Amahirwe</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#0F6B52" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .dash-wrap { padding: var(--space-6) 0 var(--space-7); max-width: 920px; margin: 0 auto; }
    .dash-welcome { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-5); }
    .dash-section { margin-bottom: var(--space-5); }
    .dash-section h2 { margin-bottom: var(--space-3); }
    .filter-row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); }
    .filter-row select { width: auto; min-height: 40px; padding: 8px 14px; }
    .user-row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
    .user-row:last-child { border-bottom: none; }
    .user-row__meta { display: flex; flex-direction: column; }
    .user-row__actions { display: flex; gap: var(--space-2); }
    .audit-row { padding: var(--space-2) 0; border-bottom: 1px solid var(--color-border); font-size: 0.9rem; }
    .audit-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skip_to_main">Skip to main content</a>
  <header class="navbar">
    <div class="navbar__inner">
      <a href="../index.html" class="navbar__brand">
        <img class="navbar__logo-mark" src="../assets/icons/logo-mark.png" alt="" aria-hidden="true" />
        <span>Amahirwe</span>
      </a>
      <div class="navbar__actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="rw" aria-pressed="true">RW</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        </div>
        <button type="button" class="btn btn-secondary" data-action="logout" data-i18n="dash_logout">Log out</button>
      </div>
    </div>
  </header>

  <main id="main-content" class="container dash-wrap">
    <div id="state-loading" class="state-message" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p data-i18n="dash_loading">Loading your dashboard…</p>
    </div>

    <div id="dashboard-content" hidden>
      <div class="dash-welcome">
        <div>
          <h1 id="welcome-heading">Muraho!</h1>
          <p class="text-secondary" data-i18n="dash_admin_subtitle">Administrator dashboard</p>
        </div>
        <span class="badge badge-mint" data-i18n="role_admin">Admin</span>
      </div>

      <section class="dash-section">
        <h2 data-i18n="dash_users">Users</h2>
        <div class="card">
          <div class="filter-row">
            <label class="form-label" for="role-filter" style="margin:0;" data-i18n="dash_filter_by_role">Filter by role</label>
            <select id="role-filter" class="form-select">
              <option value="" data-i18n="dash_all_roles">All roles</option>
              <option value="student" data-i18n="role_student">Student</option>
              <option value="teacher" data-i18n="role_teacher">Teacher</option>
              <option value="mentor" data-i18n="role_mentor">Mentor</option>
              <option value="provider" data-i18n="role_provider">Provider</option>
              <option value="parent" data-i18n="role_parent">Parent</option>
              <option value="admin" data-i18n="role_admin">Admin</option>
            </select>
          </div>
          <div id="users-list"></div>
        </div>
      </section>

      <section class="dash-section">
        <h2 data-i18n="dash_audit_log">Audit log</h2>
        <div class="card" id="audit-log"></div>
      </section>
    </div>
  </main>

  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { api } from "../js/api.js";
    import { showContent, showError, formatDate, greetingWord } from "../js/dashboard.js";

    const loadingEl = document.querySelector("#state-loading");
    const contentEl = document.querySelector("#dashboard-content");
    let currentAdminId = null;

    async function renderUsers() {
      const role = document.querySelector("#role-filter").value;
      const query = role ? `?role=${role}` : "";
      const users = await api.get(`/admin/users${query}`);
      const list = document.querySelector("#users-list");

      list.innerHTML = users
        .map((u) => {
          const needsVerification = ["mentor", "provider"].includes(u.role);
          const verifyBtn =
            needsVerification && !u.is_verified
              ? `<button type="button" class="btn btn-secondary btn-sm" data-action="verify" data-id="${u.id}">Verify</button>`
              : "";
          const toggleBtn =
            u.id === currentAdminId
              ? ""
              : u.is_active
              ? `<button type="button" class="btn btn-danger btn-sm" data-action="deactivate" data-id="${u.id}">Deactivate</button>`
              : `<button type="button" class="btn btn-secondary btn-sm" data-action="activate" data-id="${u.id}">Reactivate</button>`;

          return `<div class="user-row">
            <div class="user-row__meta">
              <strong>${u.full_name}</strong>
              <span class="text-secondary">${u.email}</span>
            </div>
            <div class="user-row__actions">
              <span class="badge badge-mint">${u.role}</span>
              ${needsVerification ? `<span class="badge ${u.is_verified ? "badge-success" : "badge-neutral"}">${u.is_verified ? "Verified" : "Unverified"}</span>` : ""}
              <span class="badge ${u.is_active ? "badge-success" : "badge-error"}">${u.is_active ? "Active" : "Deactivated"}</span>
              ${verifyBtn}${toggleBtn}
            </div>
          </div>`;
        })
        .join("");

      list.querySelectorAll("[data-action='verify']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api.patch(`/admin/users/${btn.dataset.id}/verify`);
          await renderUsers();
        });
      });
      list.querySelectorAll("[data-action='deactivate']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api.patch(`/admin/users/${btn.dataset.id}/deactivate`);
          await renderUsers();
        });
      });
      list.querySelectorAll("[data-action='activate']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api.patch(`/admin/users/${btn.dataset.id}/activate`);
          await renderUsers();
        });
      });
    }

    async function renderAuditLog() {
      const entries = await api.get("/admin/audit-log");
      const container = document.querySelector("#audit-log");
      if (entries.length === 0) {
        container.innerHTML = `<p class="text-secondary">No actions recorded yet.</p>`;
        return;
      }
      container.innerHTML = entries
        .map(
          (e) => `<div class="audit-row">
            <strong>${e.action.replace(/_/g, " ")}</strong>, ${e.target_type} ${e.detail ? `(${e.detail})` : ""}
            <span class="text-secondary"> · ${formatDate(e.created_at)}</span>
          </div>`
        )
        .join("");
    }

    document.querySelector("#role-filter").addEventListener("change", renderUsers);

    requireRole("admin").then(async (user) => {
      if (!user) return;
      currentAdminId = user.id;
      document.querySelector("#welcome-heading").textContent = `${greetingWord()}, ${user.full_name.split(" ")[0]}!`;
      window.addEventListener("amahirwe:translationsapplied", () => {
        document.querySelector("#welcome-heading").textContent = `${greetingWord()}, ${user.full_name.split(" ")[0]}!`;
      });
      await Promise.all([renderUsers(), renderAuditLog()]);
      showContent(loadingEl, contentEl);
    }).catch((err) => {
      console.error("Dashboard failed to load:", err);
      showError(loadingEl, "Couldn't load your dashboard. Please check your connection and refresh the page.");
    });
  </script>
</body>
</html>
