<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - Amahirwe</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#0F6B52" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skip_to_main">Skip to main content</a>
  <div class="dash-shell">
  <div class="dash-sidebar-backdrop"></div>
  <aside class="dash-sidebar">
    <button type="button" class="dash-sidebar__close" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <a href="../index.html" class="dash-sidebar__brand">
      <img src="../assets/icons/logo-mark.png" alt="" aria-hidden="true" />
      <span>Amahirwe</span>
    </a>
    <nav class="dash-sidebar__nav">
      <a href="dashboard.html" class="dash-sidebar__link is-active" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-i18n="nav_home">Home</span></a>
      <a href="users.html" class="dash-sidebar__link" data-page="users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.4 3-5.2 6.5-5.2s6.5 1.8 6.5 5.2"/><circle cx="17.5" cy="8.5" r="2.6"/><path d="M14.8 15.2c2.9.3 5.2 2 5.2 4.8"/></svg><span data-i18n="nav_users">Users</span></a>
      <a href="audit-log.html" class="dash-sidebar__link" data-page="audit-log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span data-i18n="nav_audit_log">Audit Log</span></a>
      <a href="settings.html" class="dash-sidebar__link" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg><span data-i18n="nav_settings">Settings</span></a>
    </nav>
    <div class="dash-sidebar__footer">
      <button type="button" class="dash-sidebar__link" data-action="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span data-i18n="dash_logout">Log out</span></button>
    </div>
  </aside>
    <div class="dash-body">
    <header class="dash-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button type="button" class="dash-sidebar-toggle" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="dash-topbar__title">
          <h1 data-i18n="dash_home">Home</h1>
          <p class="text-secondary" data-i18n="dash_admin_subtitle">Administrator dashboard</p>
        </div>
      </div>
      <div class="dash-topbar__actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="rw" aria-pressed="true">RW</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        </div>
        <div class="dash-user">
          <span class="dash-user__avatar" id="dash-user-avatar"></span>
          <div>
            <div class="dash-user__name" id="dash-user-name"></div>
            <div class="dash-user__role" id="dash-user-role"></div>
          </div>
        </div>
      </div>
    </header>
      <main id="main-content" class="dash-main">
        <div id="state-loading" class="state-message" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <p data-i18n="dash_loading">Loading&hellip;</p>
        </div>

        <div id="dashboard-content" hidden>
          <div class="stat-grid">
            <div class="stat-card">
              <span class="stat-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.4 3-5.2 6.5-5.2s6.5 1.8 6.5 5.2"/></svg></span>
              <span class="stat-card__value" id="stat-users">0</span>
              <span class="stat-card__label" data-i18n="dash_stat_total_users">Total users</span>
            </div>
            <div class="stat-card">
              <span class="stat-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 11l2 2 4-4"/></svg></span>
              <span class="stat-card__value" id="stat-students">0</span>
              <span class="stat-card__label" data-i18n="dash_stat_students">Students</span>
            </div>
            <div class="stat-card">
              <span class="stat-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l4-3 3 2 3-3 3 3 4-4 3 3"/></svg></span>
              <span class="stat-card__value" id="stat-mentors">0</span>
              <span class="stat-card__label" data-i18n="dash_stat_verified_mentors">Verified mentors</span>
            </div>
            <div class="stat-card">
              <span class="stat-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></span>
              <span class="stat-card__value" id="stat-opportunities">0</span>
              <span class="stat-card__label" data-i18n="dash_stat_active_opportunities">Active opportunities</span>
            </div>
          </div>

          <div id="pending-banner" class="card status-banner" style="color:#8A5B00;" hidden>
            <span aria-hidden="true">&#9203;</span>
            <p id="pending-text"></p>
            <a href="users.html" class="btn btn-secondary btn-sm" data-i18n="dash_review">Review</a>
          </div>

          <div class="dash-grid dash-grid--2">
            <div class="dash-panel">
              <div class="dash-panel__header">
                <h2 data-i18n="dash_signups_last_14">Signups, last 14 days</h2>
              </div>
              <div id="signups-chart"></div>
            </div>
            <div class="dash-panel">
              <div class="dash-panel__header">
                <h2 data-i18n="dash_assessment_overview">Talent assessment results</h2>
              </div>
              <div id="talent-chart"><p class="text-secondary" data-i18n="dash_no_assessments_yet">No completed assessments yet.</p></div>
            </div>
          </div>

          <div class="dash-panel">
            <div class="dash-panel__header">
              <h2 data-i18n="dash_recent_signups">Recent signups</h2>
              <a href="users.html" data-i18n="dash_view_all">View all</a>
            </div>
            <div id="recent-signups"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { api } from "../js/api.js";
    import { showContent, showError, initDashShell, formatDate } from "../js/dashboard.js";
    import { barRow, miniBarChart } from "../js/charts.js";

    const loadingEl = document.querySelector("#state-loading");
    const contentEl = document.querySelector("#dashboard-content");

    const TALENT_LABELS = {
      technology: "Technology", leadership: "Leadership", creativity: "Creativity",
      sport: "Sport", art: "Art", public_speaking: "Public Speaking", agriculture: "Agriculture",
    };

    async function render() {
      const overview = await api.get("/admin/overview");

      document.querySelector("#stat-users").textContent = overview.total_users;
      document.querySelector("#stat-students").textContent = overview.active_student_count;
      document.querySelector("#stat-mentors").textContent = overview.active_mentor_count;
      document.querySelector("#stat-opportunities").textContent = overview.active_opportunity_count;

      if (overview.pending_verification_count > 0) {
        document.querySelector("#pending-banner").hidden = false;
        document.querySelector("#pending-text").textContent =
          `${overview.pending_verification_count} mentor/provider account(s) awaiting verification.`;
      }

      document.querySelector("#signups-chart").innerHTML = miniBarChart(overview.signups_last_14_days);

      const talentEntries = Object.entries(overview.talent_area_distribution);
      if (talentEntries.length > 0) {
        const max = Math.max(...talentEntries.map(([, count]) => count));
        document.querySelector("#talent-chart").innerHTML = talentEntries
          .map(([area, count]) => barRow(TALENT_LABELS[area] || area, "", count, max))
          .join("");
      }

      const users = await api.get("/admin/users");
      document.querySelector("#recent-signups").innerHTML = users
        .slice(0, 5)
        .map(
          (u) => `<div class="simple-row">
            <span>${u.full_name} <span class="text-secondary">(${u.role})</span></span>
            <span class="text-secondary">${formatDate(u.created_at)}</span>
          </div>`
        )
        .join("");
    }

    requireRole("admin").then(async (user) => {
      if (!user) return;
      initDashShell(user, "home");
      await render();
      showContent(loadingEl, contentEl);
    }).catch((err) => {
      console.error("Dashboard failed to load:", err);
      showError(loadingEl, "Couldn't load your dashboard. Please check your connection and refresh the page.");
    });
  </script>
</body>
</html>
