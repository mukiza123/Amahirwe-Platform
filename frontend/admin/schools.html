  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { api } from "../js/api.js";
    import { showContent, showError, initDashShell } from "../js/dashboard.js";

    const loadingEl = document.querySelector("#state-loading");
    const contentEl = document.querySelector("#dashboard-content");

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function renderSchools() {
      const pendingOnly = document.querySelector("#pending-only-filter").checked;
      const query = pendingOnly ? "?pending_only=true" : "";
      const schools = await api.get(`/admin/schools${query}`);
      const list = document.querySelector("#schools-list");

      if (schools.length === 0) {
        list.innerHTML = `<div class="dash-placeholder">
          <p class="text-secondary" data-i18n="dash_no_pending_schools">Nothing to review right now.</p>
        </div>`;
        return;
      }

      list.innerHTML = schools
        .map((s) => {
          const statusBadge = s.is_approved
            ? `<span class="badge badge-success" data-i18n="dash_status_approved">Approved</span>`
            : `<span class="badge badge-neutral" data-i18n="dash_status_pending">Pending</span>`;
          const actions = s.is_approved
            ? ""
            : `<button type="button" class="btn btn-secondary btn-sm" data-action="approve" data-id="${s.id}" data-i18n="dash_approve">Approve</button>
               <button type="button" class="btn btn-danger btn-sm" data-action="reject" data-id="${s.id}" data-i18n="dash_reject">Reject</button>`;

          return `<div class="user-row" data-school-row="${s.id}">
            <div class="user-row__meta">
              <strong>${escapeHtml(s.name)}</strong>
              <span class="text-secondary">${escapeHtml(s.district)}, ${escapeHtml(s.province)}</span>
            </div>
            <div class="user-row__actions">
              ${statusBadge}
              ${actions}
            </div>
            <p class="form-error" data-row-error hidden style="grid-column:1 / -1;"></p>
          </div>`;
        })
        .join("");

      list.querySelectorAll("[data-action='approve']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api.patch(`/admin/schools/${btn.dataset.id}/approve`);
          await renderSchools();
        });
      });

      // Rejecting deletes the school outright, so the button becomes an
      // inline "are you sure?" on first click instead of acting right
      // away — this codebase avoids native confirm()/alert() dialogs
      // elsewhere, so the confirmation stays inline like everything else.
      list.querySelectorAll("[data-action='reject']").forEach((btn) => {
        btn.addEventListener("click", () => {
          const row = btn.closest("[data-school-row]");
          if (btn.dataset.confirming) {
            api
              .delete(`/admin/schools/${btn.dataset.id}`)
              .then(renderSchools)
              .catch((err) => {
                const errorEl = row.querySelector("[data-row-error]");
                errorEl.textContent = err.message || "Couldn't reject that school.";
                errorEl.hidden = false;
              });
            return;
          }
          btn.dataset.confirming = "true";
          btn.textContent = "Confirm reject?";
        });
      });
    }

    document.querySelector("#pending-only-filter").addEventListener("change", renderSchools);

    requireRole("admin").then(async (user) => {
      if (!user) return;
      initDashShell(user, "schools");
      await renderSchools();
      showContent(loadingEl, contentEl);
    }).catch((err) => {
      console.error("Failed to load schools:", err);
      showError(loadingEl, "Couldn't load schools. Please check your connection and refresh the page.");
    });
  </script>
