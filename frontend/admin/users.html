          </div>
          <div class="filter-bar">
            <label class="form-label" for="role-filter" style="margin:0;" data-i18n="dash_filter_by_role">Filter by role</label>
            <select id="role-filter" class="form-select">
              <option value="" data-i18n="dash_all_roles">All roles</option>
              <option value="student" data-i18n="role_student">Student</option>
              <option value="teacher" data-i18n="role_teacher">Teacher</option>
              <option value="mentor" data-i18n="role_mentor">Mentor</option>
              <option value="provider" data-i18n="role_provider">Provider</option>

              <option value="admin" data-i18n="role_admin">Admin</option>

  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { api } from "../js/api.js";
    import { showContent, showError, initDashShell, roleLabel } from "../js/dashboard.js";
    import { t } from "../js/main.js";

    const loadingEl = document.querySelector("#state-loading");
    const contentEl = document.querySelector("#dashboard-content");
    let currentAdminId = null;

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function initials(fullName) {
      return fullName
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part[0].toUpperCase())
        .join("");
    }

    async function renderUsers() {
      const role = document.querySelector("#role-filter").value;
      const query = role ? `?role=${role}` : "";
      const users = await api.get(`/admin/users${query}`);
      const list = document.querySelector("#users-list");

      list.innerHTML = users
        .map((u) => {
          const needsVerification = ["mentor", "provider"].includes(u.role);
          const verifyBtn =
            needsVerification && !u.is_verified
              ? `<button type="button" class="btn btn-secondary btn-sm" data-action="verify" data-id="${u.id}">${t("dash_verify", "Verify")}</button>`
              : "";
          const toggleBtn =
            u.id === currentAdminId
              ? ""
              : u.is_active
              ? `<button type="button" class="btn btn-danger btn-sm" data-action="deactivate" data-id="${u.id}">${t("dash_deactivate", "Deactivate")}</button>`
              : `<button type="button" class="btn btn-secondary btn-sm" data-action="activate" data-id="${u.id}">${t("dash_reactivate", "Reactivate")}</button>`;

          return `<div class="user-row">
            <span class="home-avatar">${initials(u.full_name)}</span>
            <div class="user-row__meta">
              <strong>${escapeHtml(u.full_name)}</strong>
              <span class="text-secondary">${escapeHtml(u.email)}</span>
            </div>
            <div class="user-row__actions">
              <span class="badge badge-mint">${roleLabel(u.role)}</span>
              ${needsVerification ? `<span class="badge ${u.is_verified ? "badge-success" : "badge-neutral"}">${u.is_verified ? t("dash_verified", "Verified") : t("dash_unverified", "Unverified")}</span>` : ""}
              <span class="badge ${u.is_active ? "badge-success" : "badge-error"}">${u.is_active ? t("dash_active", "Active") : t("dash_deactivated", "Deactivated")}</span>
              ${verifyBtn}${toggleBtn}
            </div>
          </div>`;
        })
        .join("");

      list.querySelectorAll("[data-action='verify']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api.patch(`/admin/users/${btn.dataset.id}/verify`);
          await renderUsers();
        });
      });
      list.querySelectorAll("[data-action='deactivate']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api.patch(`/admin/users/${btn.dataset.id}/deactivate`);
          await renderUsers();
        });
      });
      list.querySelectorAll("[data-action='activate']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api.patch(`/admin/users/${btn.dataset.id}/activate`);
          await renderUsers();
        });
      });
    }

    document.querySelector("#role-filter").addEventListener("change", renderUsers);

    window.addEventListener("amahirwe:translationsapplied", () => {
      if (!contentEl.hidden) renderUsers();
    });

    requireRole("admin").then(async (user) => {
      if (!user) return;
      currentAdminId = user.id;
      initDashShell(user, "users");
      await renderUsers();
      showContent(loadingEl, contentEl);
    }).catch((err) => {
      console.error("Failed to load users:", err);
      showError(loadingEl, t("dash_users_load_error", "Couldn't load users. Please check your connection and refresh the page."));
    });
  </script>
