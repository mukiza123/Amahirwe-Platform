  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { api } from "../js/api.js";
    import { showContent, showError, initDashShell, talentAreaIcon, talentAreaLabel } from "../js/dashboard.js";

    const MATCH_STATUS_LABELS = { pending: "Mentor request pending", approved: "Matched with a mentor", rejected: "Mentor request not approved" };

    const loadingEl = document.querySelector("#state-loading");
    const contentEl = document.querySelector("#dashboard-content");

    function initials(fullName) {
      return fullName
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part[0].toUpperCase())
        .join("");
    }

    async function render() {
      const children = await api.get("/parents/me/children");
      const list = document.querySelector("#children-list");

      if (children.length === 0) {
        list.innerHTML = `<div class="page-card dash-placeholder">
          <img class="dash-placeholder__illustration" src="../assets/illustrations/characters/student.png" alt="" />
          <h3 data-i18n="dash_no_children_title">No children linked yet</h3>
          <p class="text-secondary" data-i18n="dash_no_children_body">Ask your child's teacher to link your account so you can follow their progress.</p>
        </div>`;
        return;
      }

      list.innerHTML = `<div class="page-card">
        <h2 class="page-card__title">Linked Children</h2>
        ${children
          .map((c) => {
            const talents = c.top_talents.length
              ? `<div class="chip-row" style="margin-top:8px">${c.top_talents
                  .map((t) => `<span class="chip">${talentAreaIcon(t.talent_area)} ${talentAreaLabel(t.talent_area)} &middot; #${t.rank}</span>`)
                  .join("")}</div>`
              : `<p class="text-secondary" style="margin:6px 0 0;font-size:0.82rem">Hasn't completed the talent assessment yet.</p>`;

            const matchBadge = c.mentor_match_status
              ? `<span class="badge ${c.mentor_match_status === "approved" ? "badge-success" : "badge-mint"}">${MATCH_STATUS_LABELS[c.mentor_match_status]}</span>`
              : "";

            return `<div class="student-row">
              <span class="home-avatar">${initials(c.full_name)}</span>
              <div>
                <p class="assess-item__title">${c.full_name}</p>
                <p class="assess-item__meta">${c.school_name} &middot; ${c.age_range}</p>
                ${talents}
              </div>
              <div class="student-row__actions">${matchBadge}</div>
            </div>`;
          })
          .join("")}
      </div>`;
    }

    requireRole("parent").then(async (user) => {
      if (!user) return;
      initDashShell(user, "children");
      await render();
      showContent(loadingEl, contentEl);
    }).catch((err) => {
      console.error("Failed to load children:", err);
      showError(loadingEl, "Couldn't load your children. Please check your connection and refresh the page.");
    });
  </script>
