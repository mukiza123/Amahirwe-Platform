<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Amahirwe</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#0F6B52" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .dash-wrap { padding: var(--space-6) 0 var(--space-7); max-width: 720px; margin: 0 auto; }
    .dash-welcome { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-5); }
    .dash-section { margin-bottom: var(--space-5); }
    .dash-section h2 { margin-bottom: var(--space-3); }
    .status-banner { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); }
    .status-banner--pending { color: #8A5B00; }
    .opportunity-list { display: flex; flex-direction: column; gap: var(--space-3); }
    .notification-card { margin-bottom: var(--space-2); box-shadow: var(--shadow-raised-sm); }
    .notification-card--unread { border-left: 3px solid var(--color-primary-teal); }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar__inner">
      <a href="../index.html" class="navbar__brand">
        <img class="navbar__logo-mark" src="../assets/icons/logo-mark.png" alt="" aria-hidden="true" />
        <span>Amahirwe</span>
      </a>
      <div class="navbar__actions">
        <button type="button" class="btn btn-secondary" data-action="logout">Log out</button>
      </div>
    </div>
  </header>

  <main class="container dash-wrap">
    <div id="state-loading" class="state-message">
      <span class="spinner" aria-hidden="true"></span>
      <p>Loading your dashboard…</p>
    </div>

    <div id="dashboard-content" hidden>
      <div class="dash-welcome">
        <div>
          <h1 id="welcome-heading">Muraho!</h1>
          <p class="text-secondary">Opportunity provider dashboard</p>
        </div>
        <span class="badge badge-mint">Provider</span>
      </div>

      <div id="verification-banner" class="card status-banner status-banner--pending" hidden>
        <span aria-hidden="true">⏳</span>
        <p>Your account is awaiting verification by an administrator. You'll be able to post opportunities once verified.</p>
      </div>

      <div id="notifications-list" hidden></div>

      <section class="dash-section">
        <div class="card">
          <h2>Post a new opportunity</h2>
          <form id="opportunity-form" novalidate>
            <div class="form-field">
              <label class="form-label" for="title">Title</label>
              <input class="form-input" type="text" id="title" name="title" required />
            </div>
            <div class="form-field">
              <label class="form-label" for="description">Description</label>
              <textarea class="form-textarea" id="description" name="description" required></textarea>
            </div>
            <div class="form-field">
              <label class="form-label" for="talent_area">Talent area</label>
              <select class="form-select" id="talent_area" name="talent_area">
                <option value="">Open to all talents</option>
              </select>
            </div>
            <div class="form-field">
              <label class="form-label" for="location">Location</label>
              <input class="form-input" type="text" id="location" name="location" required />
            </div>
            <div class="form-field">
              <label class="form-label" for="deadline">Deadline (optional)</label>
              <input class="form-input" type="date" id="deadline" name="deadline" />
            </div>
            <p class="form-error" id="form-error" hidden></p>
            <button type="submit" class="btn btn-primary" id="submit-btn">Post opportunity</button>
          </form>
        </div>
      </section>

      <section class="dash-section">
        <h2>Your opportunities</h2>
        <div class="opportunity-list" id="opportunity-list"><p class="text-secondary">You haven't posted anything yet.</p></div>
      </section>
    </div>
  </main>

  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { showContent, loadNotifications, TALENT_AREA_LABELS, talentAreaLabel } from "../js/dashboard.js";
    import { listMyOpportunities, createOpportunity, updateOpportunity, deleteOpportunity, renderOpportunityCard } from "../js/opportunities.js";

    const loadingEl = document.querySelector("#state-loading");
    const contentEl = document.querySelector("#dashboard-content");

    const talentSelect = document.querySelector("#talent_area");
    Object.keys(TALENT_AREA_LABELS).forEach((area) => {
      const option = document.createElement("option");
      option.value = area;
      option.textContent = talentAreaLabel(area);
      talentSelect.appendChild(option);
    });

    async function renderOpportunities() {
      const opportunities = await listMyOpportunities();
      const list = document.querySelector("#opportunity-list");
      if (opportunities.length === 0) {
        list.innerHTML = `<p class="text-secondary">You haven't posted anything yet.</p>`;
        return;
      }
      list.innerHTML = opportunities.map(renderOpportunityCard).join("");

      list.querySelectorAll("[data-action='toggle-opportunity']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const isActive = btn.dataset.active === "true";
          await updateOpportunity(btn.dataset.id, { is_active: !isActive });
          await renderOpportunities();
        });
      });
      list.querySelectorAll("[data-action='delete-opportunity']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await deleteOpportunity(btn.dataset.id);
          await renderOpportunities();
        });
      });
    }

    document.querySelector("#opportunity-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.target;
      const errorEl = document.querySelector("#form-error");
      errorEl.hidden = true;

      const payload = {
        title: form.title.value.trim(),
        description: form.description.value.trim(),
        talent_area: form.talent_area.value || null,
        location: form.location.value.trim(),
        deadline: form.deadline.value || null,
      };

      try {
        await createOpportunity(payload);
        form.reset();
        await renderOpportunities();
      } catch (err) {
        errorEl.textContent = err.message || "Something went wrong.";
        errorEl.hidden = false;
      }
    });

    requireRole("provider").then(async (user) => {
      if (!user) return;
      document.querySelector("#welcome-heading").textContent = `Muraho, ${user.full_name.split(" ")[0]}!`;
      document.querySelector("#verification-banner").hidden = user.is_verified;
      document.querySelector("#opportunity-form button[type='submit']").disabled = !user.is_verified;
      showContent(loadingEl, contentEl);
      await loadNotifications(document.querySelector("#notifications-list"));
      await renderOpportunities();
    });
  </script>
</body>
</html>
