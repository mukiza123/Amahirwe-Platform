<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Opportunities - Amahirwe</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#0F6B52" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .dash-placeholder { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-2); padding: var(--space-6); }
    .dash-placeholder__illustration { width: 96px; height: auto; margin-bottom: var(--space-1); }
    .status-banner { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); }
    .status-banner--pending { color: #8A5B00; }
    .opportunity-list { display: flex; flex-direction: column; gap: var(--space-3); }
    .card-narrow { max-width: 560px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skip_to_main">Skip to main content</a>
  <div class="dash-shell">
  <div class="dash-sidebar-backdrop"></div>
  <aside class="dash-sidebar">
    <button type="button" class="dash-sidebar__close" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <a href="../index.html" class="dash-sidebar__brand">
      <img src="../assets/icons/logo-mark.png" alt="" aria-hidden="true" />
      <span>Amahirwe</span>
    </a>
    <nav class="dash-sidebar__nav">
      <a href="dashboard.html" class="dash-sidebar__link" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-i18n="nav_home">Home</span></a>
      <a href="opportunities.html" class="dash-sidebar__link is-active" data-page="opportunities"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M3 12h18"/></svg><span data-i18n="nav_my_opportunities">My Opportunities</span></a>
      <a href="notifications.html" class="dash-sidebar__link" data-page="notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 4 1.5 6 1.5 6H4.5S6 13 6 9z"/><path d="M10 20a2 2 0 004 0"/></svg><span data-i18n="nav_notifications">Notifications</span></a>
      <a href="settings.html" class="dash-sidebar__link" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg><span data-i18n="nav_settings">Settings</span></a>
    </nav>
    <div class="dash-sidebar__footer">
      <button type="button" class="dash-sidebar__link" data-action="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span data-i18n="dash_logout">Log out</span></button>
    </div>
  </aside>
    <div class="dash-body">
    <header class="dash-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="../index.html" class="dash-topbar__brand"><img src="../assets/icons/logo-mark.png" alt="Amahirwe" /></a>
        <button type="button" class="dash-sidebar-toggle" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="dash-topbar__title">
          <h1 data-i18n="nav_my_opportunities">My Opportunities</h1>
          <p class="text-secondary" data-i18n="dash_provider_subtitle">Opportunity provider dashboard</p>
        </div>
      </div>
      <div class="dash-topbar__actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="rw" aria-pressed="true">RW</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        </div>
        <a href="notifications.html" class="dash-notif-bell" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 4 1.5 6 1.5 6H4.5S6 13 6 9z"/><path d="M10 20a2 2 0 004 0"/></svg>
          <span id="dash-notif-dot" class="dash-notif-bell__dot" hidden></span>
        </a>
        <div class="dash-user">
          <span class="dash-user__avatar" id="dash-user-avatar"></span>
          <div>
            <div class="dash-user__name" id="dash-user-name"></div>
            <div class="dash-user__role" id="dash-user-role"></div>
          </div>
        </div>
      </div>
    </header>
      <main id="main-content" class="dash-main">
        <div id="state-loading" class="state-message" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <p data-i18n="dash_loading">Loading&hellip;</p>
        </div>
        <div id="dashboard-content" hidden>
          <div id="verification-banner" class="card status-banner status-banner--pending" hidden>
            <span aria-hidden="true">&#9203;</span>
            <p data-i18n="dash_provider_pending_verification">Your account is awaiting verification by an administrator. You'll be able to post opportunities once verified.</p>
          </div>

          <div class="dash-grid dash-grid--2">
            <div class="card card-narrow">
              <h2 data-i18n="dash_post_opportunity">Post a new opportunity</h2>
              <form id="opportunity-form" novalidate>
                <div class="form-field">
                  <label class="form-label" for="title" data-i18n="dash_opp_title">Title</label>
                  <input class="form-input" type="text" id="title" name="title" required />
                </div>
                <div class="form-field">
                  <label class="form-label" for="description" data-i18n="dash_opp_description">Description</label>
                  <textarea class="form-textarea" id="description" name="description" required></textarea>
                </div>
                <div class="form-field">
                  <label class="form-label" for="talent_area" data-i18n="dash_opp_talent_area">Talent area</label>
                  <select class="form-select" id="talent_area" name="talent_area">
                    <option value="" data-i18n="dash_opp_open_to_all">Open to all talents</option>
                  </select>
                </div>
                <div class="form-field">
                  <label class="form-label" for="location" data-i18n="dash_opp_location">Location</label>
                  <input class="form-input" type="text" id="location" name="location" required />
                </div>
                <div class="form-field">
                  <label class="form-label" for="deadline" data-i18n="dash_opp_deadline">Deadline (optional)</label>
                  <input class="form-input" type="date" id="deadline" name="deadline" />
                </div>
                <p class="form-error" id="form-error" hidden></p>
                <button type="submit" class="btn btn-primary btn-block" id="submit-btn" data-i18n="dash_opp_post">Post opportunity</button>
              </form>
            </div>

            <div>
              <div class="opportunity-list" id="opportunity-list"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { showContent, showError, initDashShell, TALENT_AREA_LABELS, talentAreaLabel } from "../js/dashboard.js";
    import { listMyOpportunities, createOpportunity, updateOpportunity, deleteOpportunity, renderOpportunityCard } from "../js/opportunities.js";

    const loadingEl = document.querySelector("#state-loading");
    const contentEl = document.querySelector("#dashboard-content");

    const talentSelect = document.querySelector("#talent_area");
    Object.keys(TALENT_AREA_LABELS).forEach((area) => {
      const option = document.createElement("option");
      option.value = area;
      option.textContent = talentAreaLabel(area);
      talentSelect.appendChild(option);
    });

    async function renderOpportunities() {
      const opportunities = await listMyOpportunities();
      const list = document.querySelector("#opportunity-list");
      if (opportunities.length === 0) {
        list.innerHTML = `<div class="card dash-placeholder">
          <img class="dash-placeholder__illustration" src="../assets/illustrations/supporting/opportunities.png" alt="" />
          <p class="text-secondary" data-i18n="dash_no_opportunities">You haven't posted anything yet.</p>
        </div>`;
        return;
      }
      list.innerHTML = opportunities.map(renderOpportunityCard).join("");

      list.querySelectorAll("[data-action='toggle-opportunity']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const isActive = btn.dataset.active === "true";
          await updateOpportunity(btn.dataset.id, { is_active: !isActive });
          await renderOpportunities();
        });
      });
      list.querySelectorAll("[data-action='delete-opportunity']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await deleteOpportunity(btn.dataset.id);
          await renderOpportunities();
        });
      });
    }

    document.querySelector("#opportunity-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.target;
      const errorEl = document.querySelector("#form-error");
      errorEl.hidden = true;

      const payload = {
        title: form.title.value.trim(),
        description: form.description.value.trim(),
        talent_area: form.talent_area.value || null,
        location: form.location.value.trim(),
        deadline: form.deadline.value || null,
      };

      try {
        await createOpportunity(payload);
        form.reset();
        await renderOpportunities();
      } catch (err) {
        errorEl.textContent = err.message || "Something went wrong.";
        errorEl.hidden = false;
      }
    });

    requireRole("provider").then(async (user) => {
      if (!user) return;
      initDashShell(user, "opportunities");
      document.querySelector("#verification-banner").hidden = user.is_verified;
      document.querySelector("#submit-btn").disabled = !user.is_verified;
      await renderOpportunities();
      showContent(loadingEl, contentEl);
    }).catch((err) => {
      console.error("Failed to load opportunities:", err);
      showError(loadingEl, "Couldn't load your opportunities. Please check your connection and refresh the page.");
    });
  </script>
</body>
</html>
