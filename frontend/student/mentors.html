  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { showContent, showError, initDashShell } from "../js/dashboard.js";
    import { findAMentor, listMyMatches, renderMatchCard } from "../js/matching.js";

    const loadingEl = document.querySelector("#state-loading");
    const contentEl = document.querySelector("#dashboard-content");

    async function render() {
      const content = document.querySelector("#match-content");
      let matches;
      try {
        matches = await listMyMatches();
      } catch (err) {
        content.innerHTML = `<div class="card dash-placeholder">
          <img class="dash-placeholder__illustration" src="../assets/illustrations/supporting/talent-discovery.png" alt="" />
          <h3 data-i18n="dash_need_assessment_title">Complete your assessment first</h3>
          <p class="text-secondary" data-i18n="dash_need_assessment_body">We match you to a mentor based on your top talent area.</p>
          <a class="btn btn-primary" href="assessment.html" data-i18n="nav_assessment">Assessment</a>
        </div>`;
        return;
      }

      if (matches.length === 0) {
        content.innerHTML = `<div class="card dash-placeholder">
          <img class="dash-placeholder__illustration" src="../assets/illustrations/objects/handshake.png" alt="" />
          <h3 data-i18n="dash_find_mentor_title">Ready to connect with a mentor?</h3>
          <p class="text-secondary" data-i18n="dash_find_mentor_body">We'll match you with a verified mentor in your top talent area.</p>
          <button type="button" class="btn btn-primary" id="find-mentor-btn" data-i18n="dash_find_mentor">Find a mentor</button>
        </div>`;
        document.querySelector("#find-mentor-btn").addEventListener("click", async (e) => {
          e.target.disabled = true;
          try {
            await findAMentor();
            await render();
          } catch (err) {
            content.innerHTML = `<div class="card"><p class="form-error">${err.message}</p></div>`;
          }
        });
      } else {
        content.innerHTML = matches.map((m) => renderMatchCard(m, "student")).join("");
      }
    }

    requireRole("student").then(async (user) => {
      if (!user) return;
      initDashShell(user, "mentors");
      await render();
      showContent(loadingEl, contentEl);
    }).catch((err) => {
      console.error("Failed to load mentors:", err);
      showError(loadingEl, "Couldn't load your mentor match. Please check your connection and refresh the page.");
    });
  </script>
