    <a href="../index.html" class="dash-sidebar__brand">

      <a href="opportunities.html" class="dash-sidebar__link" data-page="opportunities"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M3 12h18"/></svg><span data-i18n="nav_opportunities">Opportunities</span></a>

    <div class="dash-body">
    <header class="dash-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button type="button" class="dash-sidebar-toggle" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="dash-topbar__title">
          <h1 data-i18n="nav_notifications">Notifications</h1>
          <p class="text-secondary" data-i18n="dash_student_subtitle">Student dashboard</p>
        </div>
      </div>
      <div class="dash-topbar__actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="rw" aria-pressed="true">RW</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        </div>
        <a href="notifications.html" class="dash-notif-bell" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 4 1.5 6 1.5 6H4.5S6 13 6 9z"/><path d="M10 20a2 2 0 004 0"/></svg>
          <span id="dash-notif-dot" class="dash-notif-bell__dot" hidden></span>
        </a>
        <div class="dash-user">
          <span class="dash-user__avatar" id="dash-user-avatar"></span>
          <div>
            <div class="dash-user__name" id="dash-user-name"></div>
            <div class="dash-user__role" id="dash-user-role"></div>
          </div>
        </div>
      </div>
    </header>
      <main id="main-content" class="dash-main">
        <div id="state-loading" class="state-message" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <p data-i18n="dash_loading">Loading&hellip;</p>
        </div>
        <div id="dashboard-content" class="card-narrow" hidden>
          <div class="card" id="notification-list"></div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { requireRole } from "../js/auth.js";
    import { api } from "../js/api.js";
    import { showContent, showError, initDashShell, formatDate } from "../js/dashboard.js";

    const loadingEl = document.querySelector("#state-loading");
    const contentEl = document.querySelector("#dashboard-content");

    async function render() {
      const notifications = await api.get("/notifications/me");
      const list = document.querySelector("#notification-list");
      if (notifications.length === 0) {
        list.innerHTML = `<div class="dash-placeholder">
          <img class="dash-placeholder__illustration" src="../assets/illustrations/system/notifications.png" alt="" />
          <p class="text-secondary" data-i18n="dash_no_notifications">No notifications yet.</p>
        </div>`;
        return;
      }
      list.innerHTML = notifications
        .map(
          (n) => `<div class="notification-row${n.is_read ? "" : " notification-row--unread"}" data-id="${n.id}">
            <div><p>${n.message}</p><time class="text-secondary" style="font-size:0.8rem">${formatDate(n.created_at)}</time></div>
            ${n.is_read ? "" : `<button type="button" class="btn btn-secondary btn-sm" data-action="mark-read" data-id="${n.id}" data-i18n="dash_mark_read">Mark read</button>`}
          </div>`
        )
        .join("");

      list.querySelectorAll("[data-action='mark-read']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api.patch(`/notifications/${btn.dataset.id}/read`);
          await render();
        });
      });
    }

    requireRole("student").then(async (user) => {
      if (!user) return;
      initDashShell(user, "notifications");
      await render();
      showContent(loadingEl, contentEl);
    }).catch((err) => {
      console.error("Failed to load notifications:", err);
      showError(loadingEl, "Couldn't load notifications. Please check your connection and refresh the page.");
    });
  </script>
</body>
</html>
